'name': 'Docker GHCR'

'on':
  'workflow_dispatch':
    'inputs':
      'tag':
        'description': 'Image tag (default: commit SHA)'
        'required': false
        'type': 'string'

'permissions':
  'contents': 'read'
  'packages': 'write'

'concurrency':
  'group': 'docker-ghcr'
  'cancel-in-progress': true

'env':
  'DIST_DIR': 'dist'
  'GO_VERSION': '1.27.4'
  'NODE_VERSION': '22'

'jobs':
  'Build':
    'runs-on': 'ubuntu-latest'
    'steps':
      - 'uses': 'actions/checkout@v6'
      - 'uses': 'actions/setup-node@v5'
        'with':
          'node-version': '${{ env.NODE_VERSION }}'
          'cache': 'npm'
          'cache-dependency-path': 'client_v2/package-lock.json'
      - 'name': 'Build frontend'
        'run': |
          #!/bin/sh
          set -e -f -u -x
          npm --prefix client_v2 --quiet --no-progress ci
          npm --prefix client_v2 run build-prod
      - 'uses': 'actions/setup-go@v6'
        'with':
          'go-version': '${{ env.GO_VERSION }}'
          'cache-dependency-path': 'go.sum'
      - 'name': 'Build backend binaries'
        'run': |
          #!/bin/sh
          set -e -f -u
          commit="$(git rev-parse --short=12 HEAD)"
          version="$(sh ./scripts/make/version.sh 2>/dev/null || echo v0.0.0-ghcr-${commit})"
          source_date_epoch="$(git log -1 --format=%ct)"

          # build builds one linux binary for the docker image.  The third
          # argument is the GOARM value or '-' when it is not applicable.
          build() {
            build_os="$1"
            build_arch="$2"
            build_arm="$3"

            if [ "$build_arm" = '-' ]; then
              build_dir="AdGuardHome_${build_os}_${build_arch}"
            else
              build_dir="AdGuardHome_${build_os}_${build_arch}_${build_arm}"
            fi

            mkdir -p "./${DIST_DIR}/${build_dir}"
            env \
              GOARCH="$build_arch" \
              GOOS="$build_os" \
              GOARM="${build_arm#-}" \
              CHANNEL='edge' \
              REVISION="$(git rev-parse HEAD)" \
              SOURCE_DATE_EPOCH="$source_date_epoch" \
              VERSION="$version" \
              OUT="./${DIST_DIR}/${build_dir}/AdGuardHome" \
              sh ./scripts/make/go-build.sh
          }

          build linux amd64 -
          build linux arm64 -
          build linux arm 7
          build linux 386 -

          # build.Dockerfile expects per-architecture directories with
          # underscore-prefixed file names.
          mkdir -p "${DIST_DIR}/docker"
          cp "${DIST_DIR}/AdGuardHome_linux_amd64/AdGuardHome" "${DIST_DIR}/docker/AdGuardHome_linux_amd64_"
          cp "${DIST_DIR}/AdGuardHome_linux_arm64/AdGuardHome" "${DIST_DIR}/docker/AdGuardHome_linux_arm64_"
          cp "${DIST_DIR}/AdGuardHome_linux_arm_7/AdGuardHome" "${DIST_DIR}/docker/AdGuardHome_linux_arm_v7"
          cp "${DIST_DIR}/AdGuardHome_linux_386/AdGuardHome" "${DIST_DIR}/docker/AdGuardHome_linux_386_"

          echo "APP_VERSION=${version}" >> "$GITHUB_ENV"

          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "BUILD_DATE=${build_date}" >> "$GITHUB_ENV"

          # GHCR requires all-lowercase repository names.
          image_name="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_NAME=${image_name}" >> "$GITHUB_ENV"
      - 'uses': 'docker/setup-qemu-action@v3'
      - 'uses': 'docker/setup-buildx-action@v4'
      - 'uses': 'docker/login-action@v4'
        'with':
          'registry': 'ghcr.io'
          'username': '${{ github.actor }}'
          'password': '${{ secrets.GITHUB_TOKEN }}'
      - 'name': 'Build and push image'
        'uses': 'docker/build-push-action@v7'
        'with':
          'context': '.'
          'file': 'docker/build.Dockerfile'
          'platforms': 'linux/386,linux/amd64,linux/arm/v7,linux/arm64'
          'build-args': |
            BUILD_DATE=${{ env.BUILD_DATE }}
            DIST_DIR=${{ env.DIST_DIR }}
            VERSION=${{ env.APP_VERSION }}
            VCS_REF=${{ github.sha }}
          'tags': |
            ${{ env.IMAGE_NAME }}:${{ inputs.tag || github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          'push': 'true'
